name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IBM_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Build current Node.js Learn EPUB
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build -- --source github --ref main
      - name: Build SVG diagram mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:svg -- --source github --ref main
      - name: Build focused Kindle matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:diagram-matrix -- --source github --ref main
      - name: Inspect EPUB payload
        run: |
          TEXT="$(find dist -maxdepth 1 -name '*.epub' ! -name '*-svg.epub' ! -name '*-matrix.epub' -print | head -1)"
          SVG="$(find dist -maxdepth 1 -name '*-svg.epub' -print | head -1)"
          MATRIX="$(find dist -maxdepth 1 -name '*-matrix.epub' -print | head -1)"
          test -n "$TEXT"
          test -n "$SVG"
          test -n "$MATRIX"

          unzip -l "$TEXT" | grep -q 'IBMPlexMono-Regular.ttf'
          unzip -l "$TEXT" | grep -q 'IBMPlexMono-Bold.ttf'
          unzip -p "$TEXT" '*.xhtml' | grep -q 'text-diagram'

          python - "$TEXT" "$MATRIX" "$SVG" <<'PY'
          import re, sys, zipfile

          def xhtml(epub):
              with zipfile.ZipFile(epub) as z:
                  return ''.join(
                      z.read(name).decode('utf-8')
                      for name in z.namelist()
                      if name.endswith('.xhtml')
                  )

          text = xhtml(sys.argv[1])
          matrix = xhtml(sys.argv[2])
          svg = xhtml(sys.argv[3])

          match = re.search(r'<pre[^>]*text-diagram[^>]*><code>(.*?)</code></pre>', text, re.S)
          assert match, 'production text diagram not found'
          first, second, *rest = match.group(1).splitlines()
          assert '┌' in first and '│' in second, (repr(first), repr(second))

          labels = [
              'A — current production pre/code',
              'B — pre/code with zero horizontal margin and padding',
              'C — zero horizontal geometry + text-indent: 0.01em',
              'D — visual padding on wrapper; inner pre/code has zero geometry',
              'E — wrapper padding + inner text-indent: 0.01em',
              'F — wrapper padding + zero-width non-whitespace sentinel before first text node',
              'G — one fixed-width block per source row; spaces encoded as NBSP',
              'H — SVG control',
          ]
          for label in labels:
              assert label in matrix, f'missing matrix variant: {label}'
          for marker in [
              'matrix-zero-geometry',
              'text-diagram-frame',
              'matrix-tiny-indent',
              'matrix-sentinel',
              'text-diagram-rows',
              'text-diagram-svg',
          ]:
              assert marker in matrix, f'missing matrix marker: {marker}'

          assert 'text-diagram-svg' in svg and '<svg' in svg, 'SVG mode not emitted'
          PY

          unzip -p "$MATRIX" '*.css' | grep -q 'padding-left: 0 !important'
          unzip -p "$MATRIX" '*.css' | grep -q 'text-indent: 0.01em !important'
          test -f dist/build-metadata.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nodejs-docs-ebook
          path: |
            dist/*.epub
            dist/build-metadata.json
