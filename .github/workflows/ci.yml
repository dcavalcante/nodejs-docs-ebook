name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IBM_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Build current Node.js Learn EPUB
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build -- --source github --ref main
      - name: Inspect EPUB payload
        run: |
          EPUB="$(ls -t dist/*.epub | head -1)"
          test -n "$EPUB"
          unzip -l "$EPUB" | grep -q 'IBMPlexMono-Regular.ttf'
          unzip -l "$EPUB" | grep -q 'IBMPlexMono-Bold.ttf'
          unzip -p "$EPUB" '*.xhtml' | grep -q 'text-diagram'
          python - "$EPUB" <<'PY'
          import sys, zipfile
          epub = sys.argv[1]
          with zipfile.ZipFile(epub) as z:
              html = ''.join(
                  z.read(name).decode('utf-8')
                  for name in z.namelist()
                  if name.endswith('.xhtml')
              )
          assert '\u00a0\u00a0\u00a0┌' in html, 'diagram first-line indentation was not preserved with NBSP'
          PY
          test -f dist/build-metadata.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nodejs-docs-ebook
          path: |
            dist/*.epub
            dist/build-metadata.json
